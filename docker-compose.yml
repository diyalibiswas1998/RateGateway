name: rategate

services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 10

  api:
    build: .
    environment:
      RATEGATE_REDIS_URL: redis://redis:6379/0
      # Passed through from your terminal when set there; otherwise the app's defaults.
      RATEGATE_ALGORITHM:
      RATEGATE_CAPACITY:
      RATEGATE_REFILL_RATE:
      RATEGATE_LIMIT:
      RATEGATE_WINDOW_SECONDS:
      RATEGATE_FAIL_MODE:
      RATEGATE_PAID_API_KEYS:
    deploy:
      replicas: 3
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      retries: 15

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  # Load generator (Phase 7), only started on request:
  #   docker compose run --no-deps --rm locust -f /mnt/loadtest/locustfile.py ...
  # --no-deps matters: without it, "run" recreates the API copies from this file,
  # undoing --scale and any RATEGATE_* settings they were started with.
  # It runs on the stack's network, so its numbers don't include Windows' port forwarding.
  locust:
    image: locustio/locust:2.47.0
    profiles: ["loadtest"]
    volumes:
      - ./loadtest:/mnt/loadtest
    depends_on:
      - nginx
